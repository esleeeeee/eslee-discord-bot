name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest --junitxml=test-results/pytest.xml

      - name: Record verification source
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib
          output = pathlib.Path('test-results')
          output.mkdir(exist_ok=True)
          (output / 'source.json').write_text(json.dumps({
              'source_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'checks': ['ruff', 'pytest'],
              'note': 'See workflow step outcomes and pytest.xml for pass/fail results.'
          }, indent=2) + '\n')
          PY

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-verification
          path: test-results/
